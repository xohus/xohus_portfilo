server {
    listen 80;
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /space { return 302 /space/; }
    location = /space/ { try_files /space/solar-system.html =404; }
    location = /space/solar-system.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
